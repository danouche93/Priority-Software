services:
  - type: web
    name: soundsearch
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Only needed if you ever run the frontend separately (e.g. `npm run
      # dev`) against this deployed backend. Not needed for normal use,
      # since the backend now serves the frontend itself (same origin).
      - key: AllowedOrigin
        value: http://localhost:5173
